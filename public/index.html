<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0100f6; /* same royal blue sampled for the store */
    --fg:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    padding:24px;
  }
  .wrap{max-width:380px;width:100%;}
  .brand-logo{
    width:130px;
    height:auto;
    margin:0 auto 22px;
    display:block;
  }
  h1{font-size:28px;font-weight:700;letter-spacing:-0.01em;margin-bottom:10px;}
  p.sub{font-size:14px;color:rgba(255,255,255,0.75);margin-bottom:32px;line-height:1.5;}
  form{display:flex;flex-direction:column;gap:14px;}
  input[type="email"]{
    width:100%;padding:14px 16px;
    border:none;
    font-family:'Inter',sans-serif;font-size:14px;
    background:#fff;color:#0a0a0a;
  }
  input[type="email"]::placeholder{color:#999;}
  button{
    font-family:inherit;cursor:pointer;border:none;
  }
  .get-in-btn{
    background:#fff;color:var(--bg);
    padding:14px;font-size:14px;font-weight:700;
    letter-spacing:0.03em;text-transform:uppercase;
    transition:opacity .2s ease;
  }
  .get-in-btn:hover{opacity:0.88;}
  .get-in-btn:disabled{opacity:0.6;cursor:not-allowed;}
  .skip-btn{
    background:none;color:rgba(255,255,255,0.7);
    font-size:12px;letter-spacing:0.04em;
    padding:10px;margin-top:6px;
    text-decoration:underline;
  }
  .skip-btn:hover{color:#fff;}
  .status-line{
    font-size:13px;color:rgba(255,255,255,0.85);
    margin-top:18px;min-height:18px;
  }
  .error{color:#ffd2d2;}
</style>
</head>
<body>

<!-- ==========================================================================
  This page immediately redirects returning visitors straight to store.html —
  see the small script right below <body>. Nothing renders for them; the flash
  of unstyled content is avoided by keeping that check at the very top.
=========================================================================== -->
<script>
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : null;
  }
  const alreadyDecided = getCookie('lb_mailing_status') || localStorage.getItem('lb_mailing_status');
  if (alreadyDecided) {
    window.location.replace('store.html');
  }
</script>

<div class="wrap">
  <img src="media/lastbreed-logo.jpeg" alt="Last Breed" class="brand-logo">
  <h1>Mailing List</h1>


  <form id="signupForm">
    <input type="email" id="emailInput" placeholder="you@email.com" required>
    <button type="submit" class="get-in-btn" id="getInBtn">Get In</button>
  </form>

  <div class="status-line" id="statusLine"></div>

  <button class="skip-btn" id="skipBtn">I'm not interested</button>
</div>

<script>
  // ===================== CONFIG =====================
  // Point this at the ACTION URL of a real double-opt-in mailing list —
  // e.g. Mailchimp, Brevo (Sendinblue), or ConvertKit's own embeddable-form
  // action URL (found in their "Embed a form" / "Signup form" settings).
  // That URL is safe to put in client-side code — it's a public form
  // endpoint, NOT a secret API key. Leaving this blank means the button
  // still works and lets people through, but no real confirmation email
  // will be sent until you add a real endpoint here.
  const MAILING_LIST_ACTION_URL = ""; // e.g. "https://xxxx.list-manage.com/subscribe/post?u=XXXX&id=XXXX"
  const EMAIL_FIELD_NAME = "EMAIL"; // most providers expect this field name — check your form's real "name" attribute if unsure
  // ====================================================

  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/`;
  }

  function goToStore() {
    window.location.href = 'store.html';
  }

  function rememberChoice(status) {
    setCookie('lb_mailing_status', status, 365);
    try { localStorage.setItem('lb_mailing_status', status); } catch (e) {}
  }

  document.getElementById('signupForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim();
    if (!email) return;

    const btn = document.getElementById('getInBtn');
    const statusLine = document.getElementById('statusLine');
    btn.disabled = true;

    rememberChoice('subscribed');

    if (MAILING_LIST_ACTION_URL) {
      // Fire-and-forget: we submit to the list provider but don't wait on or
      // read the response (their double opt-in email is triggered on their
      // end), so a slow or blocked request never holds up entry to the store.
      const body = new URLSearchParams();
      body.append(EMAIL_FIELD_NAME, email);
      fetch(MAILING_LIST_ACTION_URL, { method: 'POST', mode: 'no-cors', body })
        .catch(() => {});

      statusLine.textContent = "You're in — check your email to confirm your subscription.";
      setTimeout(goToStore, 1600);
    } else {
      // No real mailing list connected yet — don't claim an email was sent.
      console.warn('MAILING_LIST_ACTION_URL is empty: no confirmation email was actually sent. Add a real double opt-in form action URL to enable this.');
      statusLine.textContent = "Welcome in.";
      setTimeout(goToStore, 700);
    }
  });

  document.getElementById('skipBtn').addEventListener('click', function () {
    rememberChoice('skipped');
    goToStore();
  });
</script>

</body>
</html>
